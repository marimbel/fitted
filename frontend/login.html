<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Fitted</title>
  <meta name="description" content="Sign in to Fitted or create a new account." />

  <!-- Favicon / app icon (hanger glyph + Fitted wordmark) -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Open Graph tags: control the title/description/image shown when
       this page is shared as a link (iMessage, Slack, etc.) or added
       to a phone's home screen, instead of a browser-generated
       fallback preview. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Login — Fitted" />
  <meta property="og:description" content="Sign in to Fitted or create a new account." />
  <meta property="og:image" content="%VITE_SITE_URL%/images/icon-512.png" />
  <meta property="og:url" content="%VITE_SITE_URL%/login.html" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared.css" />
</head>
<body>
  <!-- Minimal HTML required to mount React — LoginApp.jsx renders everything else. -->
  <div id="root"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Google Identity Services: powers the real "Sign in with Google" panel below -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="/src/main-login.jsx"></script>
</body>
</html>
